name = "analytics-backend"
main = "src/index.ts"
compatibility_date = "2024-03-12"

routes = [
  { pattern = "analytics.tabsircg.com", custom_domain = true }
]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"
TINYBIRD_HOST = "https://api.ap-east-1.aws.tinybird.co"

[[kv_namespaces]]
binding = "ANALYTICS_DOMAINS_KV"
id = "8b98adb285794312a168726b12abd774"

# --- dev environment ---
[env.dev]
name = "analytics-backend-dev"
routes = []

[env.dev.vars]
ENVIRONMENT = "dev"
TINYBIRD_HOST = "https://api.ap-east-1.aws.tinybird.co"

[[env.dev.kv_namespaces]]
binding = "ANALYTICS_DOMAINS_KV"
id = "8b98adb285794312a168726b12abd774"